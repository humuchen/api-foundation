name: Deploy API Docs (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次 Pages 部署，新推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-docs:
    name: Publish OpenAPI docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble docs site
        run: |
          mkdir -p _site
          cp openapi.json _site/openapi.json
          cp docs/api-docs.html _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库尚未启用 Pages 时，由该步骤通过 API 自动创建（需 pages: write 权限，见顶部 permissions）
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
